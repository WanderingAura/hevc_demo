; h265sim configuration, shared by h265sim-server and h265sim-client.
; Any key can be overridden on the command line as section.key=value.
; Keys marked (live) can be changed at runtime from the client UI.

[source]
kind = synthetic
width = 1920
height = 1080
fps = 30                      ; (live, reopens encoder)
sim_isp_delay_ms = 0          ; (live)
sim_isp_jitter_ms = 0         ; (live)
seed = 1                      ; ISP jitter RNG

[encoder]
backend = libx265
preset = ultrafast            ; (live, reopens encoder)
bitrate_kbps = 4000           ; (live, reopens encoder)
gop = 60                      ; (live, reopens encoder) periodic IDR backstop: 2 s at 30 fps
vbv_ms = 200                  ; (live, reopens encoder)

[server]
stats_interval_ms = 500
csv = server_frames.csv       ; empty = no CSV

[server.queue]
max_frames = 3                ; (live) 1..8
max_bytes = 2000000           ; (live)
max_age_ms = 200              ; (live) older frames are dropped to the next IDR

[transport]
host = 127.0.0.1              ; client connects here
data_port = 5600              ; TCP: FrameHeader + Annex B
control_port = 5601           ; TCP: PING, KEYFRAME_REQ, CONFIG_SET, ...
tcp_notsent_lowat = 32768
sndbuf = 131072
max_frame_bytes = 2000000     ; largest accepted access unit

[client]
decode_threads = 4            ; slice threads only, never frame threads
decode_queue = 2              ; (live) 1..8
t_stale_ms = 400              ; (live) older frames are decoded but not shown
t_hard_ms = 500               ; (live) older frames flush the decoder and request an IDR
q_max_ms = 400                ; (live) network queueing above this counts as stale
keyframe_req_min_interval_ms = 300   ; (live)
keyframe_req_max_interval_ms = 2000  ; (live) retry backoff cap
catchup_max_frames = 10       ; (live) still stale after this many -> WAIT_IDR
ping_interval_ms = 1000
vsync = false
csv = client_frames.csv       ; empty = no CSV

[clock]
require_sync = true           ; (live) distrust ages if either side is unsynchronised
sync_margin_ms = 2            ; (live) added to ages before staleness checks; "auto" = both esterrors
max_negative_transit_ms = 1   ; (live) beyond this, log a clock anomaly
